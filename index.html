<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Title, description, canonical, Open Graph and JSON-LD are set per page by
         src/components/Seo.tsx and baked into each pre-rendered HTML file. -->
    <meta name="author" content="Brew Code Tech" />
    <meta name="theme-color" content="#090909" />
    <meta name="color-scheme" content="dark" />

    <!-- Favicon — inline SVG using brand colors, with PNG fallbacks for broader support -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Scroll-in animations start hidden; without JavaScript, show everything. -->
    <noscript>
      <style>
        [style*='opacity:0'],
        [style*='opacity: 0'] {
          opacity: 1 !important;
          transform: none !important;
        }
      </style>
    </noscript>
  </head>
  <body>
    <!-- Skip to main content — for keyboard / screen reader users -->
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
